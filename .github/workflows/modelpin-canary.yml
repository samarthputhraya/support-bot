# The live check's daily canary (QUALITY_REVIEW_3 section 7): once a day, and on demand, it installs what a live
# check installs and runs .github/live/canary.py, which checks the pinned versions, the recorded baseline, and that
# each replacement a Jira admin can choose still answers on Anthropic's API (one request each, at most 1 output token;
# well under 0.01 USD a day). It prints no reply, sends nothing to any Jira site and needs no ticket. A failed run is
# GitHub's email to the repository's owner, so a broken dependency, key or model shows before a judge's check does.
#
# GitHub turns off scheduled workflows in a public repository after 60 days with no activity in it: a commit before
# 15 Jan 2027 keeps this one running to the end of judging (3 Feb 2027).
name: Modelpin canary

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC, 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Modelpin and its relay, as a live check does
        run: pip install --require-hashes -r .github/live/requirements.txt
      - name: Check what a live check needs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/live/canary.py
