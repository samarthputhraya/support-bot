# A live check started from Modelpin for Jira. A Jira admin selects "Run a live check"; their browser opens the
# start page, which runs this workflow with a sealed ticket. The ticket names that Jira site's web trigger and the
# replacement model; only this repository's MODELPIN_LIVE_SECRET opens it, and it is good for 30 minutes.
# The run scans the repository, checks the replacement against the recorded baseline, says on this run which
# scenarios regressed (names and counts only), and sends both results, signed for that one request, to that one site.
#
# The ticket is read from the event payload, so this log never shows it. Only the two "Send" steps get the site's
# address and the request's signing key, both masked. Modelpin's dependencies are pinned in .github/live/requirements.txt.
name: Modelpin live check

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Sealed by Modelpin for Jira; only this repository's secret opens it
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open the ticket
        id: ticket
        env:
          MODELPIN_LIVE_SECRET: ${{ secrets.MODELPIN_LIVE_SECRET }}
        run: node .github/live/open-ticket.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Modelpin and its relay
        run: pip install --require-hashes -r .github/live/requirements.txt
      - name: Ask about the old model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/live/old-model.py
      - name: Scan the repository
        run: modelpin watch --json > "$RUNNER_TEMP/modelpin-watch.json" || true
      - name: Send the scan to Jira
        env:
          MODELPIN_WEBHOOK_URL: ${{ steps.ticket.outputs.url }}
          MODELPIN_WEBHOOK_SECRET: ${{ steps.ticket.outputs.key }}
        run: modelpin-relay publish-watch --input "$RUNNER_TEMP/modelpin-watch.json"
      - name: Check the replacement
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          start=$(date +%s)
          code=0
          modelpin check --to "$LIVE_MODEL" || code=$?
          python .github/live/note.py --since "$start" --to "$LIVE_MODEL" --exit-code "$code" || true
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Send the check to Jira
        env:
          MODELPIN_WEBHOOK_URL: ${{ steps.ticket.outputs.url }}
          MODELPIN_WEBHOOK_SECRET: ${{ steps.ticket.outputs.key }}
          START: ${{ steps.check.outputs.start }}
          CODE: ${{ steps.check.outputs.code }}
        run: modelpin-relay publish --exit-code "$CODE" --since "$START" --to "$LIVE_MODEL"
      # Modelpin ends with exit code 1 when it confirms a regression, which is how it blocks a merge. The run ends
      # the same way here, after both results are in Jira, so the failed step is this one and never a send.
      - name: End with Modelpin's exit code
        if: steps.check.outputs.code != '0'
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: exit "$CODE"
